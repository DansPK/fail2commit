[package]
name = "fail2commit-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fail2commit-core = { version = "0.1.3", path = "../fail2commit-core" }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Controls"] }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.154"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }
