name: release-candidate

on:
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run platform-gated integration checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust components
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        shell: pwsh
        run: scripts/release/build-windows.ps1
      # windows-latest no longer ships NSIS; use the same pinned portable 3.11
      # as the local builds (hash recorded in VERIFY-2026-11-08-windows-tray.md).
      - name: Portable NSIS 3.11 (pinned)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "nsis-3.11.zip"
          curl.exe -fsSL -A Wget -o $zip "https://sourceforge.net/projects/nsis/files/NSIS%203/3.11/nsis-3.11.zip/download"
          if ($LASTEXITCODE -ne 0) { throw "NSIS download failed ($LASTEXITCODE)" }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne "c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1") { throw "nsis-3.11.zip SHA-256 mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath target/nsis -Force
      - name: NSIS installer when available
        shell: pwsh
        run: |
          if (Test-Path packaging/windows/build.ps1) {
            & packaging/windows/build.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "packaging/windows/build.ps1 is not present; NSIS artifact pending T-009 integration"
          }
      - name: Check Windows packages
        shell: pwsh
        run: |
          # build.ps1 writes the installer straight into target/dist; drop its staging tree.
          Remove-Item -Recurse -Force target/dist/stage -ErrorAction SilentlyContinue
          if (-not (Get-ChildItem target/dist -Filter 'fail2commit-*-setup.exe')) { throw "installer missing from target/dist" }
          Get-ChildItem target/dist | Format-Table Name, Length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-artifacts
          path: |
            target/dist/fail2commit-*-setup.exe
            target/dist/fail2commit-windows-x86_64.exe
            target/dist/LICENSE
            target/dist/NOTICE
            target/dist/THIRD-PARTY-NOTICES.md
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Rust components
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Dependency notices
        run: python3 scripts/release/notices.py
      - name: Verify committed notices
        run: git diff --exit-code -- THIRD-PARTY-NOTICES.md
      - name: Debian package in rust container
        run: scripts/release/build-deb.sh "$GITHUB_SHA" target/dist
      - name: Verify Debian package in clean Ubuntu
        run: scripts/release/verify-deb.sh target/dist/*.deb
      - name: Vendored source archive
        run: scripts/release/source-tarball.sh "$GITHUB_SHA" target/dist
      - name: Verify offline source build
        run: scripts/release/verify-source-tarball.sh target/dist/*-src.tar.gz
      - name: Arch package in archlinux container
        run: scripts/release/build-arch.sh target/dist/*-src.tar.gz target/dist
      - name: Verify Arch package in clean archlinux
        run: scripts/release/verify-arch.sh target/dist/fail2commit-[0-9]*-x86_64.pkg.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-artifacts
          path: |
            target/dist/*.deb
            target/dist/*-linux-amd64
            target/dist/*-src.tar.gz
            target/dist/fail2commit-[0-9]*-x86_64.pkg.tar.zst
          if-no-files-found: error

  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build VSIX when extension is present
        shell: bash
        run: |
          mkdir -p target/dist
          if [[ -f extensions/vscode/package.json ]]; then
            cd extensions/vscode
            npm ci
            npm test --if-present
            npx --yes @vscode/vsce@3.6.2 package --out ../../target/dist/
          else
            printf '%s\n' 'VSIX pending T-010 integration' > target/dist/VSIX-PENDING.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix-artifacts
          path: target/dist/*
          if-no-files-found: error

  hashes:
    needs: [windows, linux, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: target/dist
          merge-multiple: true
      - name: SHA-256 manifest
        run: scripts/release/hashes.sh target/dist
      # Sigstore-signed SLSA provenance for every file in SHA256SUMS; verify with
      # `gh attestation verify <file> -R DansPK/fail2commit`. GitHub only offers
      # attestations on private repositories with Enterprise Cloud, so skip there.
      - name: Build provenance attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: target/dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHA256SUMS
          path: target/dist/SHA256SUMS
          if-no-files-found: error

  windows-integration:
    if: ${{ inputs.run_integration }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Platform-gated Windows integration
        shell: pwsh
        run: |
          if (Test-Path packaging/windows/integration.ps1) {
            & packaging/windows/integration.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            throw "Windows integration harness is not present in this commit"
          }

  linux-integration:
    if: ${{ inputs.run_integration }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Platform-gated Linux integration
        run: |
          if [[ -x scripts/integration/linux.sh ]]; then
            scripts/integration/linux.sh
          else
            echo "Linux integration harness is not present in this commit" >&2
            exit 1
          fi
